name: Build strongR-frida iOS

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version to build'
        required: true
        default: '17.17.0'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Build Dependencies & Setup Toolchain
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew update --quiet
          brew install vala ninja meson pkg-config bison flex dpkg ldid
          
          pip3 install setuptools wheel packaging jinja2 lief meson ninja
          
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH
          
          sudo xcodebuild -license accept
          echo "IOS_CERTID=-" >> $GITHUB_ENV
          echo "=== Active SDK Path ==="
          xcrun --sdk iphoneos --show-sdk-path

      - name: Clone Frida Source (Target Version)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          FRIDA_VER="${{ github.event.inputs.frida_version }}"
          echo "Cloning Frida $FRIDA_VER..."
          
          git clone --recurse-submodules --branch "$FRIDA_VER" https://github.com/frida/frida.git frida

      - name: Apply Precision Anti-Detection Patches
        run: |
          echo "Applying safe, high-stealth anti-detection modifications..."
          python3 - << 'EOF'
          import os
          import re

          def safe_replace(file_path, search_pattern, replacement):
              if not os.path.isfile(file_path):
                  return
              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  new_content, count = re.subn(search_pattern, replacement, content)
                  if count > 0:
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      print(f"[+] Modified ({count} matches): {file_path}")
              except Exception as e:
                  print(f"[-] Error: {e}")

          # 1. 抹除 frida-gum 最核心的特征线程名 gum-js-loop
          gum_dir = "frida/subprojects/frida-gum"
          if os.path.exists(gum_dir):
              for root, _, files in os.walk(gum_dir):
                  for file in files:
                      if file.endswith(('.c', '.h')):
                          p = os.path.join(root, file)
                          safe_replace(p, r'"gum-js-loop"', '"sys-js-loop"')

          # 2. 抹除 frida-core 中的管道名与 Unix Socket 特征
          core_dir = "frida/subprojects/frida-core"
          if os.path.exists(core_dir):
              for root, _, files in os.walk(core_dir):
                  for file in files:
                      if file.endswith(('.vala', '.c')):
                          p = os.path.join(root, file)
                          safe_replace(p, r'"frida-"', '"sys-"')
                          safe_replace(p, r'\"frida-\"', '\"sys-\"')

          print("[✓] Precision anti-detection applied.")
          EOF

      - name: Build Frida for iOS arm64
        run: |
          export IOS_CERTID="-"
          cd frida
          echo "=== 1. Configuring Meson for iOS arm64 ==="
          ./configure --host=ios-arm64
          
          echo "=== 2. Compiling with Ninja ==="
          ninja -C build
          echo "=== Build Finished Successfully ==="

      - name: Package Rootless DEB & Sign Entitlements
        run: |
          FRIDA_VER="${{ github.event.inputs.frida_version }}"
          mkdir -p output
          mkdir -p deb_root/DEBIAN
          mkdir -p deb_root/var/jb/usr/sbin
          mkdir -p deb_root/var/jb/Library/LaunchDaemons

          # 1. 复制编译出的 server
          SERVER_BIN=$(find frida/build -type f -name "frida-server" | head -n 1)
          cp "$SERVER_BIN" deb_root/var/jb/usr/sbin/sys_helper
          cp "$SERVER_BIN" "output/frida-server-${FRIDA_VER}-ios-arm64"

          # 收集 Gadget 和 Inject
          find frida/build -type f -name "frida-gadget*.dylib" -exec cp {} output/frida-gadget-${FRIDA_VER}-ios-arm64.dylib \;
          find frida/build -type f -name "frida-inject" -exec cp {} output/frida-inject-${FRIDA_VER}-ios-arm64 \;

          # 2. 写入完整的 iOS 调试与 FBS 启动特权并用 ldid 签署
          cat << 'EOF' > /tmp/ent.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>task_for_pid-allow</key>
              <true/>
              <key>run-unsigned-code</key>
              <true/>
              <key>platform-application</key>
              <true/>
              <key>com.apple.system-task-ports</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.frontboard.debugapplications</key>
              <true/>
              <key>com.apple.frontboard.launchapplications</key>
              <true/>
              <key>com.apple.springboard.debugapplications</key>
              <true/>
              <key>com.apple.springboard.launchapplications</key>
              <true/>
              <key>com.apple.backboardd.debugapplications</key>
              <true/>
              <key>com.apple.backboardd.launchapplications</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          chmod 755 deb_root/var/jb/usr/sbin/sys_helper
          ldid -S/tmp/ent.plist deb_root/var/jb/usr/sbin/sys_helper
          ldid -S/tmp/ent.plist "output/frida-server-${FRIDA_VER}-ios-arm64"

          # 3. 写入自启 LaunchDaemon Plist
          cat << 'EOF' > deb_root/var/jb/Library/LaunchDaemons/re.frida.server.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>re.frida.server</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/var/jb/usr/sbin/sys_helper</string>
                  <string>-l</string>
                  <string>0.0.0.0:19999</string>
              </array>
              <key>UserName</key>
              <string>root</string>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 4. 写入 Debian Control 元数据
          cat << EOF > deb_root/DEBIAN/control
          Package: re.sys.server
          Name: Frida Core (Stealth Rootless)
          Version: ${FRIDA_VER}
          Architecture: iphoneos-arm64
          Description: Modded Frida Server with anti-detection patches for Dopamine
          Maintainer: heisukeji
          Author: heisukeji
          Section: Development
          Priority: optional
          EOF

          # 5. 写入 postinst 与 prerm 生命周期脚本
          cat << 'EOF' > deb_root/DEBIAN/postinst
          #!/bin/sh
          if [ "$1" = "configure" ] || [ "$1" = "upgrade" ]; then
              chmod 755 /var/jb/usr/sbin/sys_helper
              chown root:wheel /var/jb/usr/sbin/sys_helper
              chown root:wheel /var/jb/Library/LaunchDaemons/re.frida.server.plist
              launchctl unload /var/jb/Library/LaunchDaemons/re.frida.server.plist 2>/dev/null || true
              launchctl load -w /var/jb/Library/LaunchDaemons/re.frida.server.plist 2>/dev/null || true
          fi
          exit 0
          EOF

          cat << 'EOF' > deb_root/DEBIAN/prerm
          #!/bin/sh
          if [ "$1" = "remove" ] || [ "$1" = "purge" ] || [ "$1" = "upgrade" ]; then
              launchctl unload /var/jb/Library/LaunchDaemons/re.frida.server.plist 2>/dev/null || true
              killall -9 sys_helper 2>/dev/null || true
          fi
          exit 0
          EOF

          chmod 755 deb_root/DEBIAN/postinst deb_root/DEBIAN/prerm

          # 6. 打包生成 DEB
          DEB_NAME="re.sys.server_${FRIDA_VER}_iphoneos-arm64.deb"
          dpkg-deb -b deb_root "output/${DEB_NAME}"
          echo "=== Generated DEB Package: output/${DEB_NAME} ==="
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strongR-frida-ios-arm64-${{ github.event.inputs.frida_version }}
          path: output/
          retention-days: 30
