name: Build strongR-frida iOS

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version to build'
        required: true
        default: '17.17.0'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Dependencies & Setup Toolchain
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew update --quiet
          brew install vala ninja meson pkg-config bison flex
          pip3 install lief meson ninja
          
          # 关键修复：将 Homebrew 的 keg-only bison 和 flex 强制注入 PATH
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH
          
          echo "=== Verify Toolchain ==="
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          /opt/homebrew/opt/bison/bin/bison --version

      - name: Clone Frida Source
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          FRIDA_VER="${{ github.event.inputs.frida_version }}"
          echo "Cloning Frida $FRIDA_VER with submodules..."
          
          # 克隆指定 tag 源码
          git clone --branch "$FRIDA_VER" https://github.com/frida/frida.git frida
          cd frida
          # 完整同步递归子模块
          git submodule update --init --recursive --depth 1

      - name: Apply Safe Anti-Detection Patches
        run: |
          echo "Applying safe regex replacements on Frida 17.x..."
          python3 - << 'EOF'
          import os
          import re

          def safe_replace(file_path, search_pattern, replacement):
              if not os.path.isfile(file_path):
                  return
              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  new_content, count = re.subn(search_pattern, replacement, content)
                  if count > 0:
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      print(f"[+] Modified ({count} matches): {file_path}")
              except Exception as e:
                  print(f"[-] Error patching {file_path}: {e}")

          # 1. 消除 frida-gum 中的常驻特征线程名 (gum-js-loop, gmain 等)
          gum_dir = "frida/subprojects/frida-gum"
          if os.path.exists(gum_dir):
              for root, _, files in os.walk(gum_dir):
                  for file in files:
                      if file.endswith(('.c', '.h')):
                          p = os.path.join(root, file)
                          safe_replace(p, r'"gum-js-loop"', '"sys-js-loop"')
                          safe_replace(p, r'"gmain"', '"smain"')
                          safe_replace(p, r'"gdbus"', '"sdbus"')

          # 2. 消除 frida-core 中的管道与默认 socket 特征名（精准替换字面量，不破坏 include）
          core_dir = "frida/subprojects/frida-core"
          if os.path.exists(core_dir):
              for root, _, files in os.walk(core_dir):
                  for file in files:
                      if file.endswith(('.vala', '.c')):
                          p = os.path.join(root, file)
                          # 修改 Unix Domain Socket 命名规则
                          safe_replace(p, r'"frida-"', '"sys-"')
                          safe_replace(p, r'\"frida-\"', '\"sys-\"')
                          safe_replace(p, r'"re.frida.server"', '"re.sys.server"')

          print("[✓] Safe anti-detection patches completed.")
          EOF

      - name: Build Frida for iOS arm64
        run: |
          cd frida
          # 使用构建命令生成核心组件
          make core-ios-arm64
          echo "=== Build Finished ==="

      - name: Collect Artifacts & Ad-hoc Signing
        run: |
          mkdir -p output
          FRIDA_VER="${{ github.event.inputs.frida_version }}"
          
          # 提取编译出来的二进制文件
          find frida/build -type f -name "frida-server" 2>/dev/null | while read f; do
            echo "Found Server: $f"
            cp "$f" "output/frida-server-${FRIDA_VER}-ios-arm64"
          done

          find frida/build -type f -name "frida-inject" 2>/dev/null | while read f; do
            echo "Found Inject: $f"
            cp "$f" "output/frida-inject-${FRIDA_VER}-ios-arm64"
          done

          find frida/build -type f -name "frida-gadget*.dylib" 2>/dev/null | while read f; do
            echo "Found Gadget: $f"
            cp "$f" "output/frida-gadget-${FRIDA_VER}-ios-arm64.dylib"
          done
          
          # 自动 Ad-hoc 签名
          for bin in output/*; do
            if [ -f "$bin" ]; then
              echo "Codesigning: $bin"
              codesign -s - -f "$bin" 2>/dev/null || true
            fi
          done

          echo "=== Artifacts Summary ==="
          ls -lh output/
          
          if [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "::error::No output artifacts found!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strongR-frida-ios-arm64-${{ github.event.inputs.frida_version }}
          path: output/
          retention-days: 30
